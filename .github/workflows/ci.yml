name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      revision:
        description: Immutable release commit to check
        required: true
        type: string

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  repository:
    name: Repository / pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.94.1
          components: rustfmt
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.11"
      - run: uv sync --all-groups --locked
      - run: uv run pre-commit run --all-files

  rust-quality:
    name: Rust / quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.94.1
          components: clippy,rustfmt
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-nextest@0.9.100
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo nextest run --workspace --all-features
      - run: cargo test --workspace --doc
      - run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  rust-api:
    name: Rust / public API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.94.1
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-semver-checks@0.50.0
      - name: Compare Rust API with the pull request base
        if: github.event_name == 'pull_request'
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
        run: scripts/check_rust_api.sh "$BASE_REVISION"
      - run: cargo check --manifest-path tests/rust-consumer/Cargo.toml --locked
      - run: cargo test -p btpc-core --test compile_fail

  rust-stable:
    name: Rust / stable / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.94.1
      - run: cargo test -p btpc-core --lib verify::race_tests --locked
      - run: cargo test --workspace --all-features --locked

  rust-msrv:
    name: Rust / MSRV 1.85
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.85"
      - run: cargo check --workspace --all-targets --locked

  python:
    name: Python / ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.94.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python }}
      - run: uv sync --all-groups --locked
      - run: uv run maturin develop
      - run: uv run pytest tests/python
      - if: matrix.python == '3.11'
        run: |
          uv run ruff check .
          uv run ruff format --check .
          scripts/check_python_types.sh
          uv run python scripts/check_native_stub.py

  python-windows-paths:
    name: Python / Windows path identity
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.94.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.14"
      - run: uv sync --all-groups --locked
      - run: uv run maturin develop
      - run: uv run pytest tests/python/test_verify.py -k "path"

  dependencies:
    name: Dependencies / policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-deny@0.19.9
      - run: cargo deny check

  wheel:
    name: Wheel / clean install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.94.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.11"
      - run: uv sync --all-groups --locked
      - run: uv run maturin build --locked
      - name: Install and smoke-test wheel outside source
        shell: bash
        run: |
          wheel=$(find target/wheels -name '*manylinux*.whl' -print -quit)
          test -n "$wheel"
          uv run python scripts/check_wheel.py "$wheel" --work-dir "$RUNNER_TEMP/btpc-wheel-check"
